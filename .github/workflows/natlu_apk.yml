name: Natlu APK
on:
  push:
    branches:
      - 'Natlu_int'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run recitation tests
        run: ./gradlew :feature:recitation:testReleaseUnitTest

      - name: Upload test report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: recitation_test_report
          path: feature/recitation/build/reports/tests/testReleaseUnitTest/
          retention-days: 3

      - name: Build debug APK
        run: ./gradlew assembleMadaniDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: natlu-apk
          path: app/build/outputs/apk/madani/debug/app-madani-debug.apk
          retention-days: 14

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx8G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8"
